<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web_audio_app</title>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
    <header>
      <h2>We Audio APIステータス</h2>
      <div id="wudio_context">
	オーディオ時間: <input type="number" step="0.01" id="audio_time"> [s]
	状態: <span id="audio_status"> </span><br>
	ベースレイテンシ: <input type="number" step="0.01" id="base_latency"> [s]
	出力レイテンシ: <input type="number" step="0.01" id="output_latency"> [s]
      </div>
      <h2>Sound Font</h2>
      <span>ファイル:</span> <select id="sf_file"></select>
      <h2>MIDI</h2>
      <span>ファイル:</span> <select id="midi_file"></select> <br>
      曲の長さ: <input readonly type="number" step="0.1" id="tune_duration"> [s] <br>
      ノート数: <input readonly type="number" step="1" id="notes">  <br>
      <input id="tune_slider" type="range" min="0" max="1" step="0.001" value="0.0">
      
      <h2>コントローラー</h2>
      ボリューム: <input id="volume" type="number" min="0" max="1" step="0.01" value="0.3"> 
      <input id="volume_slider" type="range" min="0" max="1" step="0.01" value="0.3"> <br>
      <button id="play_midi" disabled>再生</button>
    </header>

    <div id="main">
      <div id="sf_table"></div>
    </div>
    
    <footer>
    </footer>
  </body>
</html>
